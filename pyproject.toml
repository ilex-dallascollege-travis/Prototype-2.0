[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prototype2"
version = "0.1.0"
description = "Event-driven quantitative trading research bot (Stage 1 Foundation)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py",
    "numpy",
    "pandas",
    "pyarrow",
    "python-dotenv",
    "pyyaml",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
